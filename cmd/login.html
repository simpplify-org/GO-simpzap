<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>SimpZap – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-gradient: radial-gradient(circle at top right, #1d2538 0%, #090b0f 70%);
      --card-bg: rgba(20, 24, 37, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-color: #00e676;
      --primary-hover: #00c853;
      --primary-glow: rgba(0, 230, 118, 0.25);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-darker: #6b7280;
      --input-bg: rgba(10, 12, 20, 0.85);
      --input-border: rgba(255, 255, 255, 0.12);
      --error-color: #ff5252;
      --error-bg: rgba(255, 82, 82, 0.1);
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 230, 118, 0.06) 0%, transparent 70%);
      top: 10%;
      left: 10%;
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, transparent 70%);
      bottom: 10%;
      right: 10%;
      z-index: 0;
      pointer-events: none;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
      z-index: 10;
      position: relative;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--primary-color);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 0 15px var(--primary-glow);
    }

    h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .field {
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
      padding: 12px 16px;
      outline: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    input::placeholder {
      color: var(--text-darker);
    }

    button {
      width: 100%;
      background: var(--primary-color);
      color: #06090e;
      border: none;
      border-radius: 12px;
      padding: 13px 22px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--primary-glow);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 6px;
    }

    button:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 25px rgba(0, 230, 118, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .msg {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }

    .msg.err {
      display: block;
      background: var(--error-bg);
      color: var(--error-color);
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="header-logo">
      <div class="logo-icon">Z</div>
      <h1>SimpZap</h1>
    </div>
    <p class="subtitle">Entre para acessar o hub de instâncias.</p>

    <form id="loginForm">
      <div class="field">
        <label for="username">Usuário</label>
        <input id="username" name="username" type="text" placeholder="seu.usuario" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button id="submitBtn" type="submit">Entrar</button>
      <div id="msg" class="msg err"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');

    function showError(text) {
      msg.textContent = text;
      msg.classList.add('err');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.classList.remove('err');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Entrando...';

      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await r.json().catch(() => ({}));

        if (!r.ok) {
          showError(data.error || `Falha no login (HTTP ${r.status})`);
          return;
        }

        window.location.href = '/dash';
      } catch (err) {
        showError('Não foi possível conectar ao servidor.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
      }
    });
  </script>
</body>

</html>
